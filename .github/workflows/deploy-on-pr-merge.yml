name: Terraform Plan (PR Develop)

on:
  pull_request:
    branches:
      - develop
    types: [opened, synchronize, reopened]      

permissions:
  id-token: write
  contents: read
  pull-requests: write

env:
  AWS_REGION: sa-east-1
  ROLE_TO_ASSUME: arn:aws:iam::915153720516:role/GitHubActions-ECS-Deploy-Role
  # Ajuste este caminho caso seu projeto esteja dentro de ./app/src/...
  LAMBDA_CSPROJ_PATH: ./app/src/Fiap.FCGames.Notifications.Lambda/Fiap.FCGames.Notifications.Lambda.csproj

jobs:
  plan:
    name: Terraform Plan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Build & Package Lambda (.NET 10 ARM64)
        run: |
          dotnet publish ${{ env.LAMBDA_CSPROJ_PATH }} \
            -c Release \
            -r linux-arm64 \
            --self-contained true \
            -o ./publish
          
          cd ./publish
          zip -r ../publish/bootstrap.zip .
        working-directory: .

      - name: Configure AWS Credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.ROLE_TO_ASSUME }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.7.0"

      - name: Terraform Init
        run: terraform init
        working-directory: ./infra
        env:
          AWS_EC2_METADATA_DISABLED: "true"

      - name: Terraform Plan
        id: plan
        run: terraform plan -no-color -input=false -lock-timeout=1m
        working-directory: ./infra

      - name: Post Plan Result to PR
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const output = `#### Terraform Plan 📖 \`${{ steps.plan.outcome }}\`
            <details><summary>Visualizar saída do Plan</summary>

            \`\`\`hcl
            ${{ steps.plan.outputs.stdout }}
            \`\`\`

            </details>`;

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: output
            })